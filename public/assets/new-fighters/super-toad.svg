    <path d="M128 318 C112 336 92 338 84 330 M128 318 C124 340 110 348 100 344 M128 318 C138 340 134 350 124 352" fill="none" stroke-width="8"/>
    <path d="M272 318 C288 336 308 338 316 330 M272 318 C276 340 290 348 300 344 M272 318 C262 340 266 350 276 352" fill="none" stroke-width="8"/>
  </g>
  <!-- warts and shine -->
  <g fill="#3f8a26" opacity=".85">
    <circle cx="96" cy="200" r="9"/><circle cx="304" cy="196" r="10"/><circle cx="116" cy="240" r="7"/>
    <circle cx="290" cy="244" r="8"/><circle cx="200" cy="140" r="8"/><circle cx="174" cy="160" r="5"/><circle cx="230" cy="158" r="6"/>
