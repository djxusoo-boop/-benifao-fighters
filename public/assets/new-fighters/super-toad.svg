    <circle cx="268" cy="112" r="50" fill="url(#body)"/>
    <circle cx="132" cy="108" r="34" fill="url(#eye)"/>
    <circle cx="268" cy="108" r="34" fill="url(#eye)"/>
    <ellipse cx="136" cy="110" rx="8" ry="24" fill="#120a04" stroke="none"/>
    <ellipse cx="264" cy="110" rx="8" ry="24" fill="#120a04" stroke="none"/>
