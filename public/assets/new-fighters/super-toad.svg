    <path d="M58 300 C10 300 8 250 50 236 C80 226 104 250 112 282 Z" fill="url(#body)"/>
    <path d="M342 300 C390 300 392 250 350 236 C320 226 296 250 288 282 Z" fill="url(#body)"/>
